# Local Postgres for development, so running the app needs nothing hosted.
#   docker compose up -d
#   DATABASE_URL="postgresql://postgres:postgres@localhost:5433/prompt_library" npm run db:migrate
#
# Port 5433 avoids clashing with a Postgres you may already run on 5432.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: prompt_library
    ports:
      - "5433:5432"
    volumes:
      - prompt-library-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prompt_library"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  prompt-library-data:
